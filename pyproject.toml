[project]
name = "pathlayer"
version = "0.0.1"
description = "Runtime guardrail layer for AI agents: detect loops, retries, cost explosions and lack of progress, and intervene during execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Pathlayer" }]
keywords = ["ai", "agents", "guardrails", "circuit-breaker", "observability", "reliability"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pathlayer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = isort, UP = pyupgrade, B = bugbear,
# SIM = flake8-simplify, C4 = comprehensions, RUF = ruff-specific.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=pathlayer --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["pathlayer"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.10"
packages = ["pathlayer"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
