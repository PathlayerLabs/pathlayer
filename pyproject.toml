[project]
name = "pathlayer"
version = "0.0.1"
description = "Runtime guardrail layer for AI agents: detect loops, retries, cost explosions and lack of progress, and intervene during execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Pathlayer" }]
keywords = ["ai", "agents", "guardrails", "circuit-breaker", "observability", "reliability"]
dependencies = []

[project.optional-dependencies]
# Optional framework integration: the LangGraph/LangChain capture adapter
# (pathlayer.adapters.langgraph). Not a runtime dependency of the core
# pipeline. Upper bounds are pinned because CI runs `pip install -e ".[dev]"`
# without a lockfile (see .github/workflows/ci.yml) across the 3.10/3.11/3.12
# matrix -- an open floor would break on a breaking major release. Both
# packages declare requires-python >=3.10.
langgraph = [
    "langgraph>=1,<2",
    "langchain-core>=1,<2",
]
# Optional YAML config support (pathlayer.config). The core reads JSON with the
# stdlib; PyYAML is only needed to load a .yaml config and is imported lazily.
yaml = [
    "pyyaml>=6",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    # Exact pin: ruff's formatter output changes between releases. Keeping dev,
    # CI and the pre-commit hook (.pre-commit-config.yaml rev) on the SAME ruff
    # avoids format ping-pong. Bump both together on upgrade.
    "ruff==0.15.17",
    "mypy>=1.11",
    "types-PyYAML>=6",
    "pre-commit>=3.8",
    # Bring in the LangGraph adapter deps so the smoke test runs in dev/CI.
    "pathlayer[langgraph]",
    # Bring in PyYAML so the YAML config path is exercised in dev/CI.
    "pathlayer[yaml]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pathlayer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = isort, UP = pyupgrade, B = bugbear,
# SIM = flake8-simplify, C4 = comprehensions, RUF = ruff-specific.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=pathlayer --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["pathlayer"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.10"
packages = ["pathlayer"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
