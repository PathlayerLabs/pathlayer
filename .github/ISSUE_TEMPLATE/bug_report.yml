name: Bug report
description: Something does not work as the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a false positive or a missed detection, use the dedicated template instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the full error message or traceback.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest code, configuration or command that shows the problem. Remove secrets and private data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pathlayer version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      options:
        - LangGraph
        - OpenClaw
        - Core API / custom adapter
        - Packaging or installation
