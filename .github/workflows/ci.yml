name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: every job only checks out code and passes artifacts within
# this run, so a push or a contributor's pull request cannot write anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy
      - name: Tests
        run: pytest

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build release artifacts
        run: |
          python -m pip install --upgrade pip
          pip install twine uv
          bash scripts/build_dist.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  package-wheel:
    needs: package-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Test core wheel outside checkout
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install --upgrade pip
          .package-venv/bin/pip install --no-deps dist/*.whl
          smoke_dir="$(mktemp -d)"
          (
            cd "$smoke_dir"
            "$GITHUB_WORKSPACE/.package-venv/bin/python" \
              "$GITHUB_WORKSPACE/scripts/packaging_smoke.py" \
              --extras core \
              --readme "$GITHUB_WORKSPACE/README.md"
          )
          .package-venv/bin/pip check

  package-sdist:
    needs: package-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Test source distribution outside checkout
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install --upgrade pip
          .package-venv/bin/pip install --no-deps dist/*.tar.gz
          smoke_dir="$(mktemp -d)"
          (
            cd "$smoke_dir"
            "$GITHUB_WORKSPACE/.package-venv/bin/python" \
              "$GITHUB_WORKSPACE/scripts/packaging_smoke.py" \
              --extras core \
              --readme "$GITHUB_WORKSPACE/README.md"
          )
          .package-venv/bin/pip check

  package-extras:
    needs: package-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            resolution: lowest-direct
            mode: lower-bounds
            extra: yaml
          - python-version: "3.10"
            resolution: lowest-direct
            mode: lower-bounds
            extra: langgraph
          - python-version: "3.12"
            resolution: highest
            mode: wheel-metadata
            extra: yaml
          - python-version: "3.12"
            resolution: highest
            mode: wheel-metadata
            extra: langgraph
          - python-version: "3.12"
            resolution: highest
            mode: wheel-metadata
            extra: all
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Test optional dependency bounds from wheel
        run: |
          python -m pip install --upgrade pip uv
          python -m venv .package-venv
          wheel="$(realpath dist/*.whl)"
          if [ "${{ matrix.mode }}" = "wheel-metadata" ]; then
            extra="${{ matrix.extra }}"
            if [ "$extra" = "all" ]; then
              extra="yaml,langgraph"
            fi
            uv pip install \
              --python .package-venv/bin/python \
              --resolution "${{ matrix.resolution }}" \
              "${wheel}[${extra}]"
          elif [ "${{ matrix.extra }}" = "yaml" ]; then
            uv pip install \
              --python .package-venv/bin/python \
              --resolution "${{ matrix.resolution }}" \
              "pyyaml>=6.0.1"
            uv pip install \
              --python .package-venv/bin/python \
              --no-deps \
              "$wheel"
          else
            uv pip install \
              --python .package-venv/bin/python \
              --resolution "${{ matrix.resolution }}" \
              "langgraph>=1.2,<2" \
              "langchain-core>=1,<2"
            uv pip install \
              --python .package-venv/bin/python \
              --no-deps \
              "$wheel"
          fi
          smoke_dir="$(mktemp -d)"
          (
            cd "$smoke_dir"
            "$GITHUB_WORKSPACE/.package-venv/bin/python" \
              "$GITHUB_WORKSPACE/scripts/packaging_smoke.py" \
              --extras "${{ matrix.extra }}" \
              --readme "$GITHUB_WORKSPACE/README.md"
          )
          .package-venv/bin/pip check

  # Known vulnerabilities in what a user installs: the built wheel with every
  # extra, resolved to the newest allowed versions on the newest supported
  # Python (markers can select other packages on older versions). Development
  # tools are not audited. A vulnerability with no usable fix can be skipped
  # with `--ignore-vuln <ID>`, next to a comment that says why.
  dependency-audit:
    needs: package-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Audit runtime dependencies (pip-audit)
        run: |
          python -m pip install --upgrade pip uv "pip-audit==2.10.1"
          python -m venv .audit-venv
          uv pip install --python .audit-venv/bin/python "$(realpath dist/*.whl)[yaml,langgraph]"
          .audit-venv/bin/python -m pip freeze --exclude pathlayer > runtime-requirements.txt
          cat runtime-requirements.txt
          pip-audit \
            --requirement runtime-requirements.txt \
            --no-deps \
            --disable-pip \
            --progress-spinner off

  package-gate:
    if: always()
    needs:
      - test
      - package-build
      - package-wheel
      - package-sdist
      - package-extras
      - dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Require every test and packaging job
        env:
          RESULTS: >-
            ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["RESULTS"])
          failed = {
              name: details["result"]
              for name, details in results.items()
              if details["result"] != "success"
          }
          if failed:
              raise SystemExit(f"required CI jobs did not succeed: {failed}")
          PY
