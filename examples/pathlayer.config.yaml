# Pathlayer configuration reference (INF-4).
#
# Every value below is the built-in default: with NO config file present,
# Pathlayer behaves exactly as if this file were loaded. Copy it to
# `.pathlayer/config.yaml` at your project root and override only what you need.
#
# Discovered filenames: `.pathlayer/config.yaml`, `.yml`, or `.json` (keep only
# one). JSON works with no extra dependency; YAML needs the optional extra:
# pip install "pathlayer[yaml]".
#
# Load and build a pipeline:
#     from pathlayer import load_config, build_pipeline
#     pipeline = build_pipeline(load_config())   # discovers .pathlayer/config.*

detectors:
  # LoopDetector: exact repeated action block at the tail of the stream.
  loop:
    enabled: true
    k: 2          # min consecutive repetitions before any confidence (>= 2)
    window: 256   # tail size scanned per step (>= 2 * k)
  # LOOP-2 precision (issue #113): loop cannot see `result` by design, so a
  # repeated call that is actually improving (e.g. re-running the same test
  # suite while `passed` climbs) would otherwise be stopped as a false
  # positive. AUTO-WIRING: when both `loop` and `no_progress` are enabled (and
  # `loop` is not advisory), a loop <- progress suppression is wired
  # automatically -- loop cannot drive STOP on any tick where the last event
  # set a fresh record on the ground-truth test/exit_code anchors (the git
  # diff anchor is deliberately excluded: it is gameable and would let useless
  # padding suppress a real loop). Not a user-facing config key in V1.

  # RetryDetector: RET-1 (same failing call replayed, same error) folded with
  # RET-2 (one tool dominating the recent window regardless of args/error).
  retry:
    enabled: true
    threshold: 3  # RET-1: consecutive identical failures mapped to confidence 1.0 (>= 2)
    # RET-2 sliding-window tool dominance. Capped below stop_threshold, so a
    # tool storm reinforces a stop via fusion but never stops a run on its own.
    window: 16                    # recent tool calls scanned (>= dominance_min_calls)
    dominance_min_calls: 5        # min calls of one tool in the window to fire (>= 2)
    dominance_ratio: 0.75         # min share of the window that one tool must hold, (0, 1]
    dominance_max_confidence: 0.85  # cap for the dominance component, in [0, 1]
    min_failures: 2               # min failures in the window before it can fire (>= 1)

  # BudgetDetector: cumulative cost_usd vs a ceiling.
  # Disabled by default: a $5 ceiling would stop a legitimately expensive run.
  # Enable it with a ceiling chosen for your workload.
  budget:
    enabled: false
    max_cost_usd: 5.0
    baseline_usd: 0.0   # cross-run spend already recorded (wired by INF-1 later)

  # NoProgressDetector: CUSUM over progress records (the $47k slow-burn case).
  # Anchors are code-level (built-in coding anchors: tests, exit codes, git
  # diff); only these scalar thresholds are configurable.
  no_progress:
    enabled: true
    target_rate: 0.2   # increment per stagnant step (> 0)
    threshold: 2.0     # cumulative sum at which it fires (> 0)
    window: 64         # >= ceil(threshold / target_rate) + 1

# Per-tool canonicalization overrides (CAN-2). Empty by default.
canonicalization:
  tool_masks: {}
  # Example:
  # tool_masks:
  #   read_file:                 # keep a distinguishing id the heuristic would mask
  #     keep: ["file_id"]
  #   api_call:                  # re-mask a volatile id so retries collapse
  #     mask: ["attempt_id"]

policy:
  stop_threshold: 0.9     # fused confidence at/above which we STOP (in [0, 1])
  advisory_signals: []    # signals computed/logged but never allowed to STOP
                          # (one of: loop, retry, budget, no_progress)
  # Per-detector fusion weights (ARB-1) in [0, 1]; missing names default to 1.0.
  # Signals are fused with a weighted noisy-OR (1 - prod(1 - weight * confidence)),
  # so two converging signals reinforce each other. A weight of 0 makes a signal
  # inert (same effect as listing it in advisory_signals). Empty = all 1.0.
  weights: {}
  # Example: trust the loop detector fully but soften no_progress.
  # weights:
  #   loop: 1.0
  #   no_progress: 0.5

  # Graded action ladder (ARB-3). By default only STOP is active (at
  # stop_threshold), so arbitration is NONE/STOP -- the recommended setup today.
  #
  # STATUS: only STOP currently *acts* (halts the run). The intermediate tiers
  # are decided and logged but NOT enforced yet -- their real behaviour lands in
  # ACT-1..4 (Sprint 4). Until then, the one meaningful intermediate tier is a
  # single "alert before stop": a WARN band below stop_threshold that surfaces a
  # problem in the logs before anything is cut.
  #
  # Opt in by giving a tier a fused-confidence threshold (< stop_threshold).
  # Recommended for now -- warn, then stop:
  # tier_thresholds:
  #   warn: 0.7
  #
  # The other tiers (summarize, fallback, escalate) already exist in the ladder
  # so config is forward-compatible, but they are inert until ACT-1..4. If you
  # do set several, they must be < stop_threshold and non-decreasing with
  # severity (warn <= summarize <= fallback <= escalate).
  tier_thresholds: {}
  # Hysteresis: consecutive confirming ticks before a tier change commits, so a
  # one-tick spike does not flip the action. 1 = no hysteresis (follow the
  # target immediately, the previous behaviour).
  #
  # Semantics: the counter tracks consecutive ticks of *pressure away from the
  # committed tier* (target above it for escalation, below for de-escalation),
  # then jumps straight to the current target tier once the count is reached --
  # not one tier per N ticks. Consequence: if the fused confidence climbs
  # through tiers, the destination is wherever it is when the counter trips, so
  # STOP can commit after fewer than escalate_ticks ticks *at STOP level* (e.g.
  # with escalate_ticks=2, a WARN-level tick then a STOP-level tick commits
  # STOP). A single non-confirming tick resets the counter, so a spike from
  # baseline never escalates.
  #
  # LOOP-2 precision note: the loop <- progress suppression above (see
  # detectors.loop) only reads the *last* event, so if your agent's progress
  # action (e.g. `run_tests`) is not replayed on every tick -- interleaved
  # instead with other repeated actions in a longer cycle -- the suppression
  # can lift for a tick right after genuine progress. Raising escalate_ticks
  # above the longest gap between progress ticks in your agent's legitimate
  # cycle absorbs this: the up-counter resets on every fresh-evidence tick
  # before it reaches the commit threshold, so loop still never STOPs a
  # genuinely advancing cycle. No code change needed, just this knob.
  escalate_ticks: 1
  deescalate_ticks: 1

  # Priority overrides (ARB-4). Some signals don't deserve the graduated path:
  # a rule maps a detector to a confidence threshold + action that is committed
  # IMMEDIATELY, bypassing both fusion and hysteresis. The headline case is
  # "budget at ceiling = stop now".
  #
  # AUTO-WIRING: when the budget detector is enabled (detectors.budget.enabled),
  # a `budget -> {threshold: 1.0, action: stop}` rule is added automatically, so
  # hitting the ceiling stops at once regardless of escalate_ticks. You do NOT
  # need to declare it. Declaring `budget` here overrides that default; listing
  # `budget` in advisory_signals disables it (advisory wins, and the two cannot
  # be combined -- that is rejected).
  #
  # Fields per rule: `threshold` (confidence in [0, 1], default 1.0) and
  # `action` (warn/summarize/fallback/escalate/stop, default stop). As with the
  # ladder tiers, only STOP is actually enforced in V1; an override to an
  # intermediate tier is decided and logged but inert until ACT-1..4.
  overrides: {}
  # Example: soften the budget brake to fire at 95% of the ceiling, and add a
  # custom immediate stop when the loop detector is fully saturated.
  # overrides:
  #   budget:
  #     threshold: 0.95
  #     action: stop
  #   loop:
  #     threshold: 1.0
  #     action: stop

pipeline:
  recent_history: 10      # events kept in the post-mortem tail (>= 0)

store:
  # Cross-run SQLite state path (INF-1). Inert today: not read or created yet.
  path: ".pathlayer/state.db"
