# Local gate. Install once with `pre-commit install`: it sets up both hook
# types below. Commits run the checks and ruff; pushes also run mypy, from the
# active environment. pytest stays in CI: the full suite takes minutes.
default_install_hook_types: [pre-commit, pre-push]
# Ruff and the YAML/TOML checks run at commit time only, not again on push.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the exact ruff pin in pyproject.toml ([dev]) so local commits
    # and CI format identically. Bump both together.
    rev: v0.15.17
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      # Same command as CI: targets and strictness come from [tool.mypy] in
      # pyproject.toml, so no file list is passed.
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
