# Local gate before each commit. Install once: `pre-commit install`.
# mypy and pytest run in CI (kept out of pre-commit to keep commits fast).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the exact ruff pin in pyproject.toml ([dev]) so local commits
    # and CI format identically. Bump both together.
    rev: v0.15.17
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
